<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Notebook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#EEECE2;
  --paper-card:#FBFAF4;
  --ink:#20241F;
  --muted:#6B6F60;
  --line:#D8D3C0;
  --grid: rgba(32,36,31,0.055);
  --teal:#2F6F62;
  --teal-dark:#204E44;
  --rust:#A8442E;
  --amber:#B8842A;
  --sage:#4C7A3D;
  --shadow: 0 1px 2px rgba(32,36,31,0.08), 0 4px 14px rgba(32,36,31,0.06);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'IBM Plex Sans', sans-serif;
  color:var(--ink);
  background:var(--paper);
}
.app{display:flex; height:100vh; overflow:hidden;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:290px; min-width:290px;
  background:var(--paper-card);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:18px 14px;
  overflow:hidden;
}
.brand{
  font-family:'Source Serif 4', serif;
  font-size:20px; font-weight:700;
  letter-spacing:0.2px;
  margin:2px 2px 2px;
}
.brand-sub{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px; color:var(--muted);
  letter-spacing:0.5px; text-transform:uppercase;
  margin:0 2px 16px;
}
.btn{
  font-family:'IBM Plex Sans', sans-serif;
  font-size:13px; font-weight:500;
  border:1px solid var(--line);
  background:var(--paper-card);
  color:var(--ink);
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--paper); border-color:var(--ink);}
.btn-primary{
  background:var(--teal); color:#fff; border-color:var(--teal);
}
.btn-primary:hover{background:var(--teal-dark); border-color:var(--teal-dark);}
.btn-danger{color:var(--rust); border-color:var(--rust); background:transparent;}
.btn-danger:hover{background:var(--rust); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:5px 9px; font-size:12px;}

.search-box{
  margin:10px 0 8px;
  position:relative;
}
.search-box input{
  width:100%; padding:8px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12.5px;
  border:1px solid var(--line); border-radius:6px;
  background:#fff; color:var(--ink);
}
.search-box input:focus{outline:2px solid var(--teal); outline-offset:1px;}

.exp-list{
  flex:1; overflow-y:auto; margin-top:6px;
  display:flex; flex-direction:column; gap:8px;
  padding-right:2px;
}
.exp-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  padding:9px 10px 9px 12px;
  cursor:pointer;
  position:relative;
  transition:border-color .12s, transform .08s;
}
.exp-item:hover{border-color:var(--teal);}
.exp-item.active{border-color:var(--teal); background:#F4FAF8; box-shadow:var(--shadow);}
.exp-item .tag-num{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600; font-size:13px;
  display:inline-block;
  background:var(--amber); color:#fff;
  padding:1px 7px;
  border-radius:2px;
  transform:rotate(-1.2deg);
  box-shadow:var(--shadow);
  margin-bottom:5px;
}
.exp-item .exp-title{
  font-size:13px; font-weight:500; line-height:1.3;
  margin-bottom:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.exp-item .exp-meta{
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px; color:var(--muted);
  display:flex; align-items:center; gap:6px;
}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
.dot-planned{background:var(--amber);}
.dot-running{background:var(--teal);}
.dot-done{background:var(--sage);}
.dot-failed{background:var(--rust);}

.sidebar-empty{
  color:var(--muted); font-size:12.5px; text-align:center;
  padding:30px 10px; font-style:italic;
}
.sidebar-footer{
  border-top:1px solid var(--line);
  margin-top:10px; padding-top:10px;
  display:flex; flex-direction:column; gap:6px;
}

/* ---------- MAIN ---------- */
.main{
  flex:1; overflow-y:auto;
  background-image:
    repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 28px);
  background-color:var(--paper);
}
.page{
  max-width:880px; margin:0 auto;
  padding:40px 44px 90px;
}
.no-selection{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:80vh; color:var(--muted); text-align:center; gap:14px;
}
.no-selection .glyph{font-size:40px; opacity:.5;}

.page-header{
  display:flex; align-items:flex-start; gap:18px; margin-bottom:22px;
}
.exp-label{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600; font-size:20px;
  color:#fff; background:var(--amber);
  padding:6px 14px;
  border-radius:2px;
  transform:rotate(-1.5deg);
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.title-input{
  font-family:'Source Serif 4', serif;
  font-size:26px; font-weight:600;
  border:none; background:transparent;
  width:100%; padding:4px 2px;
  border-bottom:2px solid transparent;
}
.title-input:focus{outline:none; border-bottom:2px solid var(--teal);}
.title-input::placeholder{color:#B7B4A5;}

.meta-row{
  display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px;
}
.field-chip{
  display:flex; flex-direction:column; gap:2px;
  background:var(--paper-card); border:1px solid var(--line);
  border-radius:6px; padding:6px 10px;
}
.field-chip label{
  font-family:'IBM Plex Mono', monospace; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
}
.field-chip input, .field-chip select{
  border:none; background:transparent; font-family:'IBM Plex Mono', monospace;
  font-size:13px; color:var(--ink); padding:1px 0; min-width:90px;
}
.field-chip input:focus, .field-chip select:focus{outline:none;}

.section{
  margin-bottom:30px;
}
.section-title{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--teal-dark); font-weight:600;
  border-bottom:1px solid var(--line);
  padding-bottom:6px; margin-bottom:12px;
  display:flex; justify-content:space-between; align-items:center;
}

/* scheme dropzone */
.scheme-zone{
  border:1.5px dashed var(--line);
  border-radius:8px;
  min-height:160px;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:8px;
  background:var(--paper-card);
  cursor:pointer; position:relative;
  padding:14px; text-align:center;
  transition:border-color .12s, background .12s;
}
.scheme-zone.drag{border-color:var(--teal); background:#F2FAF7;}
.scheme-zone img{max-width:100%; max-height:340px; border-radius:4px;}
.scheme-hint{font-size:12.5px; color:var(--muted); max-width:400px; line-height:1.5;}
.scheme-hint b{color:var(--ink);}
.scheme-actions{position:absolute; top:8px; right:8px; display:flex; gap:6px;}

/* reagent table */
.rg-table-wrap{overflow-x:auto;}
table.rg-table{
  width:100%; border-collapse:collapse;
  font-family:'IBM Plex Mono', monospace; font-size:12.5px;
}
table.rg-table th{
  text-align:left; font-weight:600; font-size:10px;
  text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
  padding:4px 6px; border-bottom:1px solid var(--line);
  white-space:nowrap;
}
table.rg-table td{
  padding:3px 6px; border-bottom:1px solid var(--line);
}
table.rg-table input[type=text], table.rg-table input[type=number]{
  width:100%; border:none; background:transparent;
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:4px 2px;
}
table.rg-table input:focus{outline:1px solid var(--teal); border-radius:2px;}
table.rg-table input[type=checkbox]{width:auto; cursor:pointer;}
.rg-computed{color:var(--teal-dark); font-weight:600;}
.rg-del-btn{
  border:none; background:transparent; color:var(--rust);
  cursor:pointer; font-size:13px; padding:2px 5px;
}
.rg-del-btn:hover{background:#fbeae6; border-radius:3px;}
.add-row-btn{
  margin-top:8px; font-family:'IBM Plex Mono', monospace;
}

/* conditions */
.cond-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
  gap:10px;
}
.cond-grid .field-chip{width:100%;}
.cond-grid input{width:100%;}

textarea.ruled{
  width:100%; min-height:130px; resize:vertical;
  font-family:'IBM Plex Sans', sans-serif; font-size:14px; line-height:28px;
  border:1px solid var(--line); border-radius:6px;
  padding:6px 12px;
  background-image:repeating-linear-gradient(transparent, transparent 27px, var(--line) 28px);
  background-attachment:local;
}
textarea.ruled:focus{outline:none; border-color:var(--teal);}

.result-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px;}

.toolbar{
  position:sticky; bottom:0; left:0; right:0;
  background:var(--paper-card); border-top:1px solid var(--line);
  padding:12px 44px; display:flex; gap:8px; align-items:center;
  box-shadow:0 -4px 14px rgba(32,36,31,0.06);
}
.toolbar .spacer{flex:1;}
.save-status{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted);}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(32,36,31,0.4);
  display:flex; align-items:center; justify-content:center; z-index:50;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:#fff; border-radius:10px; width:560px; max-width:92vw;
  max-height:85vh; overflow-y:auto; padding:22px 26px; box-shadow:var(--shadow);
}
.modal h3{font-family:'Source Serif 4', serif; margin:0 0 4px; font-size:20px;}
.modal p.sub{color:var(--muted); font-size:12.5px; margin:0 0 16px;}
.modal label{font-size:12px; font-weight:600; display:block; margin:12px 0 4px;}
.modal input[type=date], .modal input[type=text]{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
  font-family:'IBM Plex Mono', monospace; font-size:13px;
}
.modal .row2{display:flex; gap:10px;}
.modal .row2 > div{flex:1;}
.status-checks{display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;}
.status-checks label{display:flex; align-items:center; gap:5px; font-weight:400; font-size:12.5px; margin:0;}
.recap-output{
  width:100%; min-height:220px; margin-top:14px;
  font-family:'IBM Plex Mono', monospace; font-size:12px;
  border:1px solid var(--line); border-radius:6px; padding:10px;
}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
.close-x{
  position:absolute; top:14px; right:16px; cursor:pointer; font-size:18px; color:var(--muted);
  background:none; border:none;
}
.modal{position:relative;}
.hint-banner{
  font-size:12px; color:var(--muted); background:var(--paper-card);
  border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:14px; line-height:1.5;
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">Lab Notebook</div>
    <div class="brand-sub">Electronic Ledger</div>
    <div id="storageModeNote" style="font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; line-height:1.5; margin-bottom:10px;"></div>
    <button class="btn btn-primary btn-block" id="newExpBtn">+ New experiment</button>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="search number, title, tag…">
    </div>
    <div class="exp-list" id="expList"></div>
    <div class="sidebar-footer">
      <button class="btn btn-block btn-sm" id="recapBtn">Recap for Claude</button>
      <button class="btn btn-block btn-sm" id="backupBtn">Download backup (.json)</button>
      <button class="btn btn-block btn-sm" id="importBtn">Import backup (.json)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </aside>

  <main class="main">
    <div class="page" id="page"></div>
  </main>

</div>

<div class="modal-overlay hidden" id="recapModal">
  <div class="modal">
    <button class="close-x" id="closeRecap">✕</button>
    <h3>Recap for Claude</h3>
    <p class="sub">Filter the experiments you want summarized, generate the text, then copy it into a chat with Claude for analysis. Claude does not read this notebook automatically — this is the bridge.</p>
    <div class="row2">
      <div>
        <label>From date</label>
        <input type="date" id="recapFrom">
      </div>
      <div>
        <label>To date</label>
        <input type="date" id="recapTo">
      </div>
    </div>
    <label>Tag contains (optional)</label>
    <input type="text" id="recapTag" placeholder="e.g. photoredox, spirocycle…">
    <label>Status</label>
    <div class="status-checks" id="recapStatus">
      <label><input type="checkbox" value="planned" checked> Planned</label>
      <label><input type="checkbox" value="running" checked> Running</label>
      <label><input type="checkbox" value="done" checked> Done</label>
      <label><input type="checkbox" value="failed" checked> Failed</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" id="generateRecapBtn">Generate</button>
      <button class="btn btn-sm btn-primary" id="copyRecapBtn">Copy to clipboard</button>
    </div>
    <textarea class="recap-output" id="recapOutput" placeholder="Markdown summary will appear here…"></textarea>
  </div>
</div>

<script>
(function(){
  // ---------- Storage layer ----------
  // If this file is opened inside Claude's own artifact preview, window.storage
  // already exists and is used as-is (synced to your Claude account).
  // If opened as a standalone downloaded file (no Claude runtime), we fall back
  // to this browser's localStorage so entries still persist between sessions
  // on THIS machine/browser. Either way the rest of the app code is unchanged.
  const usingLocalFallback = !window.storage;
  if(usingLocalFallback){
    const NS = 'labnotebook:';
    window.storage = {
      async get(key){
        const raw = localStorage.getItem(NS+key);
        if(raw === null) throw new Error('key not found: '+key);
        return {key, value: raw, shared:false};
      },
      async set(key, value){
        localStorage.setItem(NS+key, value);
        return {key, value, shared:false};
      },
      async delete(key){
        localStorage.removeItem(NS+key);
        return {key, deleted:true, shared:false};
      },
      async list(prefix){
        const keys=[];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(NS)){
            const kk = k.slice(NS.length);
            if(!prefix || kk.startsWith(prefix)) keys.push(kk);
          }
        }
        return {keys, shared:false};
      }
    };
  }

  let index = [];          // [{number,title,date,status,tags:[]}]
  let current = null;      // full experiment object currently loaded
  let dirty = false;

  const expList = document.getElementById('expList');
  const page = document.getElementById('page');
  const searchInput = document.getElementById('searchInput');

  function blankExperiment(number){
    return {
      number, date:new Date().toISOString().slice(0,10), title:'',
      status:'planned', tags:'',
      schemeImage:null,
      objective:'',
      reagents:[blankReagent()],
      solvent:'', concentration:'', temp:'', atmosphere:'', time:'',
      procedure:'', observations:'',
      resultDate:'', yieldPct:'', results:''
    };
  }
  function blankReagent(){
    return {name:'', mw:'', mass:'', vol:'', dens:'', ref:false, notes:''};
  }

  function suggestNextNumber(){
    if(index.length===0) return 'EXP-001';
    const last = index[index.length-1].number;
    const m = last.match(/^(.*?)(\d+)$/);
    if(m){
      const prefix=m[1], digits=m[2];
      const next=(parseInt(digits,10)+1).toString().padStart(digits.length,'0');
      return prefix+next;
    }
    return last+'-2';
  }

  async function loadIndex(){
    try{
      const r = await window.storage.get('exp:index', false);
      index = r ? JSON.parse(r.value) : [];
    }catch(e){ index = []; }
    renderList();
  }
  async function saveIndex(){
    try{ await window.storage.set('exp:index', JSON.stringify(index), false); }
    catch(e){ console.error('index save failed', e); }
  }
  function upsertIndexEntry(exp){
    const entry = {number:exp.number, title:exp.title, date:exp.date, status:exp.status, tags:exp.tags};
    const i = index.findIndex(e=>e.number===exp.number);
    if(i>=0) index[i]=entry; else index.push(entry);
    index.sort((a,b)=> a.number.localeCompare(b.number, undefined, {numeric:true}));
  }
  function removeIndexEntry(number){
    index = index.filter(e=>e.number!==number);
  }

  async function loadExperiment(number){
    try{
      const r = await window.storage.get('exp:'+number, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function saveExperiment(exp){
    try{
      const ok = await window.storage.set('exp:'+exp.number, JSON.stringify(exp), false);
      if(!ok) throw new Error('no result');
      upsertIndexEntry(exp);
      await saveIndex();
      return true;
    }catch(e){ console.error('save failed', e); return false; }
  }
  async function deleteExperiment(number){
    try{ await window.storage.delete('exp:'+number, false); }catch(e){}
    removeIndexEntry(number);
    await saveIndex();
  }

  function statusDotClass(s){ return 'dot-'+(s||'planned'); }

  function renderList(){
    const q = searchInput.value.trim().toLowerCase();
    expList.innerHTML='';
    let items = index.slice().reverse();
    if(q){
      items = items.filter(e =>
        e.number.toLowerCase().includes(q) ||
        (e.title||'').toLowerCase().includes(q) ||
        (e.tags||'').toLowerCase().includes(q)
      );
    }
    if(items.length===0){
      expList.innerHTML = '<div class="sidebar-empty">No experiments yet.<br>Click "+ New experiment" to start your first entry.</div>';
      return;
    }
    items.forEach(e=>{
      const div=document.createElement('div');
      div.className='exp-item'+(current && current.number===e.number ? ' active':'');
      div.innerHTML = `
        <span class="tag-num">${escapeHtml(e.number)}</span>
        <div class="exp-title">${escapeHtml(e.title||'(untitled)')}</div>
        <div class="exp-meta"><span class="dot ${statusDotClass(e.status)}"></span> ${e.date||''}</div>
      `;
      div.onclick = ()=> openExperiment(e.number);
      expList.appendChild(div);
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function openExperiment(number){
    if(dirty){
      const ok = confirm('You have unsaved changes on the current entry. Discard them and switch?');
      if(!ok) return;
    }
    const exp = await loadExperiment(number);
    current = exp || blankExperiment(number);
    dirty = false;
    renderList();
    renderPage();
  }

  document.getElementById('newExpBtn').onclick = ()=>{
    if(dirty && current){
      const ok = confirm('Discard unsaved changes on the current entry?');
      if(!ok) return;
    }
    const number = prompt('Experiment number', suggestNextNumber());
    if(!number) return;
    if(index.some(e=>e.number===number)){
      alert('That experiment number already exists. Open it from the list instead, or choose a different number.');
      return;
    }
    current = blankExperiment(number);
    dirty = true;
    renderList();
    renderPage();
  };

  searchInput.oninput = renderList;

  function markDirty(){ dirty = true; updateSaveStatus(); }

  function updateSaveStatus(){
    const el = document.getElementById('saveStatus');
    if(!el) return;
    el.textContent = dirty ? 'Unsaved changes' : 'Saved';
    el.style.color = dirty ? 'var(--rust)' : 'var(--muted)';
  }

  function computeReagentDerived(r, refMmol){
    const mass = (r.vol && r.dens) ? (parseFloat(r.vol)*parseFloat(r.dens)) : parseFloat(r.mass);
    const mw = parseFloat(r.mw);
    const mmol = (mass>0 && mw>0) ? (mass/mw) : null;
    const eq = (mmol!=null && refMmol) ? (mmol/refMmol) : null;
    return {mmol, eq};
  }
  function getRefMmol(){
    const refRow = current.reagents.find(r=>r.ref);
    if(!refRow) return null;
    const d = computeReagentDerived(refRow, null);
    return d.mmol;
  }

  function renderPage(){
    if(!current){
      page.innerHTML = `<div class="no-selection"><div class="glyph">⚗</div><div>Select an experiment from the ledger,<br>or start a new entry.</div></div>`;
      return;
    }
    const exp = current;
    page.innerHTML = `
      <div class="page-header">
        <span class="exp-label">${escapeHtml(exp.number)}</span>
        <input class="title-input" id="f-title" placeholder="Reaction title / short name" value="${escapeHtml(exp.title)}">
      </div>

      <div class="meta-row">
        <div class="field-chip"><label>Date</label><input type="date" id="f-date" value="${exp.date||''}"></div>
        <div class="field-chip"><label>Status</label>
          <select id="f-status">
            <option value="planned">Planned</option>
            <option value="running">Running</option>
            <option value="done">Done</option>
            <option value="failed">Failed</option>
          </select>
        </div>
        <div class="field-chip" style="flex:1; min-width:200px;"><label>Tags (comma-separated)</label><input type="text" id="f-tags" value="${escapeHtml(exp.tags)}" placeholder="photoredox, cyclization…"></div>
      </div>

      <div class="section">
        <div class="section-title">Reaction scheme</div>
        <div class="scheme-zone" id="schemeZone" tabindex="0">
          ${exp.schemeImage ? `<img src="${exp.schemeImage}" id="schemeImg">
             <div class="scheme-actions"><button class="btn btn-sm" id="clearScheme">Remove</button></div>`
           : `<div class="scheme-hint"><b>Click here and paste (Ctrl/Cmd+V)</b> a structure copied from ChemDraw — or drag &amp; drop / choose an image file below.<br>Native .cdx / .cdxml files can't be parsed in-browser; copy the scheme as an image from ChemDraw first.</div>
              <input type="file" accept="image/*" id="schemeFile" style="font-size:12px;">`}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Objective</div>
        <textarea class="ruled" id="f-objective" style="min-height:60px;" placeholder="What is this experiment testing / trying to achieve?">${exp.objective}</textarea>
      </div>

      <div class="section">
        <div class="section-title">Reagents &amp; equivalents<button class="btn btn-sm add-row-btn" id="addRow">+ Add reagent</button></div>
        <div class="rg-table-wrap">
          <table class="rg-table">
            <thead><tr>
              <th>Ref</th><th>Reagent</th><th>MW (g/mol)</th><th>Mass (mg)</th><th>Vol (µL)</th><th>d (g/mL)</th><th>mmol</th><th>Eq.</th><th>Notes</th><th></th>
            </tr></thead>
            <tbody id="rgBody"></tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Conditions</div>
        <div class="cond-grid">
          <div class="field-chip"><label>Solvent</label><input type="text" id="f-solvent" value="${escapeHtml(exp.solvent)}"></div>
          <div class="field-chip"><label>Conc. (M)</label><input type="text" id="f-conc" value="${escapeHtml(exp.concentration)}"></div>
          <div class="field-chip"><label>Temp (°C)</label><input type="text" id="f-temp" value="${escapeHtml(exp.temp)}"></div>
          <div class="field-chip"><label>Atmosphere</label><input type="text" id="f-atm" value="${escapeHtml(exp.atmosphere)}" placeholder="N2, Ar, air…"></div>
          <div class="field-chip"><label>Time</label><input type="text" id="f-time" value="${escapeHtml(exp.time)}" placeholder="e.g. 16 h"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Experimental procedure</div>
        <textarea class="ruled" id="f-procedure" placeholder="Step-by-step procedure as performed…">${exp.procedure}</textarea>
      </div>

      <div class="section">
        <div class="section-title">Observations / monitoring</div>
        <textarea class="ruled" id="f-observations" style="min-height:80px;" placeholder="TLC, colour changes, in-process checks…">${exp.observations}</textarea>
      </div>

      <div class="section">
        <div class="section-title">Result</div>
        <div class="result-row">
          <div class="field-chip"><label>Result date</label><input type="date" id="f-resultdate" value="${exp.resultDate||''}"></div>
          <div class="field-chip"><label>Yield (%)</label><input type="text" id="f-yield" value="${escapeHtml(exp.yieldPct)}"></div>
        </div>
        <textarea class="ruled" id="f-results" placeholder="Isolated yield, purity, characterization summary, conclusions…">${exp.results}</textarea>
      </div>
    `;

    document.getElementById('f-status').value = exp.status||'planned';

    // wire meta fields
    bind('f-title','title'); bind('f-date','date'); bind('f-tags','tags');
    document.getElementById('f-status').onchange = e=>{exp.status=e.target.value; markDirty();};
    bind('f-objective','objective'); bind('f-solvent','solvent'); bind('f-conc','concentration');
    bind('f-temp','temp'); bind('f-atm','atmosphere'); bind('f-time','time');
    bind('f-procedure','procedure'); bind('f-observations','observations');
    bind('f-resultdate','resultDate'); bind('f-yield','yieldPct'); bind('f-results','results');

    function bind(id, field){
      const el = document.getElementById(id);
      el.oninput = ()=>{ exp[field]=el.value; markDirty(); };
    }

    renderReagents();
    document.getElementById('addRow').onclick = ()=>{
      exp.reagents.push(blankReagent());
      renderReagents(); markDirty();
    };

    // scheme zone
    const zone = document.getElementById('schemeZone');
    zone.onclick = ()=> zone.focus();
    zone.addEventListener('paste', handlePaste);
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); zone.classList.remove('drag');
      const f = e.dataTransfer.files[0];
      if(f && f.type.startsWith('image/')) readImageFile(f);
    });
    const fileInput = document.getElementById('schemeFile');
    if(fileInput) fileInput.onchange = e=>{
      const f = e.target.files[0];
      if(f) readImageFile(f);
    };
    const clearBtn = document.getElementById('clearScheme');
    if(clearBtn) clearBtn.onclick = ()=>{ exp.schemeImage=null; markDirty(); renderPage(); };

    function handlePaste(e){
      const items = (e.clipboardData || window.clipboardData).items;
      for(const item of items){
        if(item.type.startsWith('image/')){
          const blob = item.getAsFile();
          readImageBlob(blob);
          e.preventDefault();
          return;
        }
      }
    }
    function readImageFile(file){ readImageBlob(file); }
    function readImageBlob(blob){
      const reader = new FileReader();
      reader.onload = ()=>{
        exp.schemeImage = reader.result;
        markDirty();
        renderPage();
      };
      reader.readAsDataURL(blob);
    }

    updateSaveStatus();
  }

  function renderReagents(){
    const exp = current;
    const body = document.getElementById('rgBody');
    body.innerHTML='';
    const refMmol = getRefMmol();
    exp.reagents.forEach((r, idx)=>{
      const tr = document.createElement('tr');
      const derived = computeReagentDerived(r, refMmol);
      tr.innerHTML = `
        <td style="text-align:center;"><input type="checkbox" ${r.ref?'checked':''} data-f="ref"></td>
        <td><input type="text" value="${escapeHtml(r.name)}" data-f="name" placeholder="e.g. NBS"></td>
        <td><input type="number" value="${r.mw}" data-f="mw"></td>
        <td><input type="number" value="${r.mass}" data-f="mass" ${(r.vol&&r.dens)?'disabled':''}></td>
        <td><input type="number" value="${r.vol}" data-f="vol"></td>
        <td><input type="number" value="${r.dens}" data-f="dens"></td>
        <td class="rg-computed">${derived.mmol!=null? derived.mmol.toFixed(3):'—'}</td>
        <td class="rg-computed">${derived.eq!=null? derived.eq.toFixed(2):(r.ref?'1.00':'—')}</td>
        <td><input type="text" value="${escapeHtml(r.notes)}" data-f="notes" placeholder="notes"></td>
        <td><button class="rg-del-btn" title="remove row">✕</button></td>
      `;
      tr.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const f = inp.dataset.f;
          if(inp.type==='checkbox'){
            if(f==='ref'){ exp.reagents.forEach(rr=>rr.ref=false); r.ref = inp.checked; }
          } else {
            r[f]=inp.value;
          }
          markDirty();
          renderReagents();
        });
      });
      tr.querySelector('.rg-del-btn').onclick = ()=>{
        exp.reagents.splice(idx,1);
        if(exp.reagents.length===0) exp.reagents.push(blankReagent());
        markDirty(); renderReagents();
      };
      body.appendChild(tr);
    });
  }

  // toolbar (appended once, lives outside re-rendered page via fixed position through CSS 'sticky' inside page flow)
  function ensureToolbar(){
    let tb = document.getElementById('toolbar');
    if(tb) return tb;
    tb = document.createElement('div');
    tb.className='toolbar'; tb.id='toolbar';
    tb.innerHTML = `
      <button class="btn btn-primary" id="saveBtn">Save entry</button>
      <button class="btn" id="dupBtn">Duplicate</button>
      <button class="btn btn-danger" id="delBtn">Delete</button>
      <div class="spacer"></div>
      <span class="save-status" id="saveStatus">Saved</span>
    `;
    document.querySelector('.main').appendChild(tb);
    document.getElementById('saveBtn').onclick = onSave;
    document.getElementById('dupBtn').onclick = onDuplicate;
    document.getElementById('delBtn').onclick = onDelete;
    return tb;
  }
  ensureToolbar();

  async function onSave(){
    if(!current) return;
    if(!current.title){
      const proceed = confirm('This entry has no title. Save anyway?');
      if(!proceed) return;
    }
    const ok = await saveExperiment(current);
    if(ok){ dirty=false; updateSaveStatus(); renderList(); }
    else alert('Save failed — storage error. Try again.');
  }
  async function onDuplicate(){
    if(!current) return;
    const number = prompt('New experiment number for the duplicate', suggestNextNumber());
    if(!number) return;
    if(index.some(e=>e.number===number)){ alert('That number already exists.'); return; }
    const copy = JSON.parse(JSON.stringify(current));
    copy.number = number;
    copy.status = 'planned';
    copy.resultDate=''; copy.results=''; copy.yieldPct='';
    current = copy; dirty = true;
    renderList(); renderPage();
  }
  async function onDelete(){
    if(!current) return;
    if(!confirm(`Delete experiment ${current.number}? This cannot be undone.`)) return;
    await deleteExperiment(current.number);
    current = null; dirty=false;
    renderList(); renderPage();
  }

  window.addEventListener('beforeunload', (e)=>{
    if(dirty){ e.preventDefault(); e.returnValue=''; }
  });

  // ---------- Recap modal ----------
  const recapModal = document.getElementById('recapModal');
  document.getElementById('recapBtn').onclick = ()=> recapModal.classList.remove('hidden');
  document.getElementById('closeRecap').onclick = ()=> recapModal.classList.add('hidden');

  document.getElementById('generateRecapBtn').onclick = async ()=>{
    const from = document.getElementById('recapFrom').value;
    const to = document.getElementById('recapTo').value;
    const tag = document.getElementById('recapTag').value.trim().toLowerCase();
    const checked = Array.from(document.querySelectorAll('#recapStatus input:checked')).map(c=>c.value);

    let matches = index.filter(e=>{
      if(from && e.date < from) return false;
      if(to && e.date > to) return false;
      if(tag && !(e.tags||'').toLowerCase().includes(tag)) return false;
      if(!checked.includes(e.status||'planned')) return false;
      return true;
    });

    const out = document.getElementById('recapOutput');
    if(matches.length===0){ out.value = '(No experiments match those filters.)'; return; }

    out.value = 'Loading…';
    let md = `# Lab notebook recap\n\nGenerated ${new Date().toISOString().slice(0,10)} — ${matches.length} experiment(s)\n\n`;
    for(const m of matches){
      const exp = await loadExperiment(m.number);
      if(!exp) continue;
      md += `## ${exp.number} — ${exp.title||'(untitled)'}\n`;
      md += `- Date: ${exp.date||'—'} | Status: ${exp.status} | Tags: ${exp.tags||'—'}\n`;
      if(exp.objective) md += `- Objective: ${exp.objective}\n`;
      if(exp.reagents && exp.reagents.length){
        const refMmol = (()=>{ const r=exp.reagents.find(x=>x.ref); if(!r) return null;
          const mass=(r.vol&&r.dens)?(parseFloat(r.vol)*parseFloat(r.dens)):parseFloat(r.mass);
          const mw=parseFloat(r.mw); return (mass>0&&mw>0)? mass/mw : null; })();
        md += `- Reagents:\n`;
        exp.reagents.forEach(r=>{
          if(!r.name) return;
          const mass=(r.vol&&r.dens)?(parseFloat(r.vol)*parseFloat(r.dens)):parseFloat(r.mass);
          const mw=parseFloat(r.mw);
          const mmol=(mass>0&&mw>0)?mass/mw:null;
          const eq = r.ref ? 1 : (mmol!=null && refMmol ? (mmol/refMmol) : null);
          md += `  - ${r.name}${r.mw?` (MW ${r.mw})`:''}${mmol!=null?`, ${mmol.toFixed(3)} mmol`:''}${eq!=null?`, ${eq.toFixed(2)} eq`:''}${r.ref?' [reference/limiting]':''}${r.notes?` — ${r.notes}`:''}\n`;
        });
      }
      const conds = [exp.solvent && `solvent ${exp.solvent}`, exp.concentration && `${exp.concentration} M`, exp.temp && `${exp.temp} °C`, exp.atmosphere && exp.atmosphere, exp.time && exp.time].filter(Boolean).join(', ');
      if(conds) md += `- Conditions: ${conds}\n`;
      if(exp.procedure) md += `- Procedure: ${exp.procedure}\n`;
      if(exp.observations) md += `- Observations: ${exp.observations}\n`;
      if(exp.results || exp.yieldPct){
        md += `- Result (${exp.resultDate||'no date'}): ${exp.yieldPct? exp.yieldPct+'% yield. ':''}${exp.results||''}\n`;
      }
      md += `\n`;
    }
    out.value = md;
  };

  document.getElementById('copyRecapBtn').onclick = ()=>{
    const out = document.getElementById('recapOutput');
    out.select();
    navigator.clipboard.writeText(out.value).then(()=>{
      const btn = document.getElementById('copyRecapBtn');
      const old = btn.textContent; btn.textContent='Copied ✓';
      setTimeout(()=>btn.textContent=old, 1400);
    }).catch(()=>{ alert('Could not copy automatically — select the text and copy manually.'); });
  };

  // ---------- Backup / restore ----------
  document.getElementById('backupBtn').onclick = async ()=>{
    const all = [];
    for(const e of index){
      const exp = await loadExperiment(e.number);
      if(exp) all.push(exp);
    }
    const blob = new Blob([JSON.stringify(all, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `lab-notebook-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const arr = JSON.parse(text);
      if(!Array.isArray(arr)) throw new Error('not an array');
      let imported=0, skipped=0;
      for(const exp of arr){
        if(!exp.number){ skipped++; continue; }
        if(index.some(e=>e.number===exp.number)){
          const overwrite = confirm(`Experiment ${exp.number} already exists. Overwrite it?`);
          if(!overwrite){ skipped++; continue; }
        }
        await saveExperiment(exp);
        imported++;
      }
      alert(`Import complete: ${imported} imported, ${skipped} skipped.`);
      renderList();
    }catch(err){
      alert('Could not read that file as a valid backup JSON.');
    }
    e.target.value='';
  };

  const modeNote = document.getElementById('storageModeNote');
  if(modeNote){
    modeNote.textContent = usingLocalFallback
      ? '💾 Saving to this browser only. Back up regularly.'
      : '☁ Saved to your Claude account.';
  }

  loadIndex().then(renderPage);
})();
</script>
</body>
</html>
